    - name: "[azure-wg] ping gcp-wg via VPC private IP"
      command: ping -c 3 -W 3 {{ gcp_wg_private }}
      when: inventory_hostname in groups['wg_azure']
      register: azure_ping_gcp_priv
      changed_when: false

