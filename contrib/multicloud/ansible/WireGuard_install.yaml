---
# WireGuard mesh installation across 5 clouds
#
# WireGuard tunnel network: 10.200.0.0/24
#   tc-wg    wg0: 10.200.0.1   vpc: 10.202.0.0/16
#   aws-wg   wg0: 10.200.0.2   vpc: 10.201.0.0/16
#   ali-wg   wg0: 10.200.0.3   vpc: 10.203.0.0/16
#   gcp-wg   wg0: 10.200.0.4   vpc: 10.204.0.0/16
#   azure-wg wg0: 10.200.0.5   vpc: 10.205.0.0/16
#
# Usage:
#   ansible-playbook -i hosts.ini WireGuard_install.yaml

# -------------------------------------------------------
# Play 0: Bootstrap root SSH access on AWS/GCP/Azure instances
# Rocky Linux AMI 默认只允许 rocky 用户登录，需先以 rocky 身份
# 把 authorized_keys 复制到 root，后续统一用 root 操作
# -------------------------------------------------------
- name: Bootstrap root SSH access on AWS, GCP and Azure instances
  hosts: aws_bootstrap,gcp_bootstrap
  become: true
  tasks:
    - name: Ensure /root/.ssh directory
      file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Copy authorized_keys to root
      copy:
        src: /home/rocky/.ssh/authorized_keys
        dest: /root/.ssh/authorized_keys
        remote_src: yes
        owner: root
        group: root
        mode: '0600'

    - name: Enable root SSH login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin yes'
        state: present

    - name: Restart sshd
      systemd:
        name: sshd
        state: restarted

    - name: Verify root SSH access
      local_action:
        module: shell
        cmd: >
          ssh -i ../terraform/my_key
          -o StrictHostKeyChecking=no
          -o ConnectTimeout=10
          root@{{ ansible_host }} echo ok
      become: false
      register: result
      retries: 5
      delay: 3
      until: result.rc == 0

- name: Bootstrap root SSH access on Azure instances (almalinux user)
  hosts: azure_bootstrap
  become: true
  tasks:
    - name: Ensure /root/.ssh directory
      file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Copy authorized_keys to root
      copy:
        src: /home/almalinux/.ssh/authorized_keys
        dest: /root/.ssh/authorized_keys
        remote_src: yes
        owner: root
        group: root
        mode: '0600'

    - name: Enable root SSH login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin yes'
        state: present

    - name: Restart sshd
      systemd:
        name: sshd
        state: restarted

    - name: Verify root SSH access
      local_action:
        module: shell
        cmd: >
          ssh -i ../terraform/my_key
          -o StrictHostKeyChecking=no
          -o ConnectTimeout=10
          root@{{ ansible_host }} echo ok
      become: false
      register: result
      retries: 5
      delay: 3
      until: result.rc == 0

# -------------------------------------------------------
# Play 1: Install packages and generate key pairs
# -------------------------------------------------------
- name: Install WireGuard and generate keys
  hosts: wg_nodes
  become: true
  vars:
    wg_port: 51820
  tasks:
    - name: Install wireguard-tools
      yum:
        name: wireguard-tools
        state: present

    - name: Persist IP forwarding
      copy:
        dest: /etc/sysctl.d/99-wireguard.conf
        content: |
          net.ipv4.ip_forward = 1

    - name: Enable IP forwarding (runtime)
      command: sysctl -w net.ipv4.ip_forward=1
      changed_when: false

    - name: Ensure /etc/wireguard directory
      file:
        path: /etc/wireguard
        state: directory
        mode: '0700'

    - name: Generate private key
      shell: wg genkey > /etc/wireguard/privatekey
      args:
        creates: /etc/wireguard/privatekey

    - name: Secure private key
      file:
        path: /etc/wireguard/privatekey
        mode: '0600'

    - name: Derive public key from private key
      shell: wg pubkey < /etc/wireguard/privatekey > /etc/wireguard/publickey
      args:
        creates: /etc/wireguard/publickey

    - name: Read private key
      slurp:
        src: /etc/wireguard/privatekey
      register: _privkey

    - name: Read public key
      slurp:
        src: /etc/wireguard/publickey
      register: _pubkey

    - name: Store key facts (available to Play 2 via hostvars)
      set_fact:
        wg_privkey: "{{ _privkey.content | b64decode | trim }}"
        wg_pubkey:  "{{ _pubkey.content  | b64decode | trim }}"

# -------------------------------------------------------
# Play 2: Write wg0.conf and start WireGuard
# Keys from Play 1 are accessible via hostvars[]
# -------------------------------------------------------
- name: Configure wg0 and start WireGuard
  hosts: wg_nodes
  become: true
  vars:
    wg_port: 51820
    # WireGuard mesh IPs
    tc_wg_ip:    "10.200.0.1"
    aws_wg_ip:   "10.200.0.2"
    ali_wg_ip:   "10.200.0.3"
    gcp_wg_ip:   "10.200.0.4"
    azure_wg_ip: "10.200.0.5"
    # Cloud VPC CIDRs
    tc_vpc:    "10.202.0.0/16"
    aws_vpc:   "10.201.0.0/16"
    ali_vpc:   "10.203.0.0/16"
    gcp_vpc:   "10.204.0.0/16"
    azure_vpc: "10.205.0.0/16"
  handlers:
    - name: restart wg0
      systemd:
        name: wg-quick@wg0
        state: restarted
  tasks:
    # ---- tc-wg config ----
    - name: Write wg0.conf for tc-wg
      copy:
        dest: /etc/wireguard/wg0.conf
        mode: '0600'
        content: |
          [Interface]
          Address    = {{ tc_wg_ip }}/24
          PrivateKey = {{ hostvars[groups['wg_tc'][0]]['wg_privkey'] }}
          ListenPort = {{ wg_port }}

          # aws-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_aws'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_aws'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ aws_wg_ip }}/32, {{ aws_vpc }}
          PersistentKeepalive = 25

          # ali-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_ali'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_ali'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ ali_wg_ip }}/32, {{ ali_vpc }}
          PersistentKeepalive = 25

          # gcp-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_gcp'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_gcp'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ gcp_wg_ip }}/32, {{ gcp_vpc }}
          PersistentKeepalive = 25

          # azure-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_azure'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_azure'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ azure_wg_ip }}/32, {{ azure_vpc }}
          PersistentKeepalive = 25
      when: inventory_hostname in groups['wg_tc']
      notify: restart wg0

    # ---- aws-wg config ----
    - name: Write wg0.conf for aws-wg
      copy:
        dest: /etc/wireguard/wg0.conf
        mode: '0600'
        content: |
          [Interface]
          Address    = {{ aws_wg_ip }}/24
          PrivateKey = {{ hostvars[groups['wg_aws'][0]]['wg_privkey'] }}
          ListenPort = {{ wg_port }}

          # tc-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_tc'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_tc'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ tc_wg_ip }}/32, {{ tc_vpc }}
          PersistentKeepalive = 25

          # ali-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_ali'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_ali'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ ali_wg_ip }}/32, {{ ali_vpc }}
          PersistentKeepalive = 25

          # gcp-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_gcp'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_gcp'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ gcp_wg_ip }}/32, {{ gcp_vpc }}
          PersistentKeepalive = 25

          # azure-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_azure'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_azure'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ azure_wg_ip }}/32, {{ azure_vpc }}
          PersistentKeepalive = 25
      when: inventory_hostname in groups['wg_aws']
      notify: restart wg0

    # ---- ali-wg config ----
    - name: Write wg0.conf for ali-wg
      copy:
        dest: /etc/wireguard/wg0.conf
        mode: '0600'
        content: |
          [Interface]
          Address    = {{ ali_wg_ip }}/24
          PrivateKey = {{ hostvars[groups['wg_ali'][0]]['wg_privkey'] }}
          ListenPort = {{ wg_port }}

          # tc-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_tc'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_tc'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ tc_wg_ip }}/32, {{ tc_vpc }}
          PersistentKeepalive = 25

          # aws-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_aws'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_aws'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ aws_wg_ip }}/32, {{ aws_vpc }}
          PersistentKeepalive = 25

          # gcp-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_gcp'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_gcp'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ gcp_wg_ip }}/32, {{ gcp_vpc }}
          PersistentKeepalive = 25

          # azure-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_azure'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_azure'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ azure_wg_ip }}/32, {{ azure_vpc }}
          PersistentKeepalive = 25
      when: inventory_hostname in groups['wg_ali']
      notify: restart wg0

    # ---- gcp-wg config ----
    - name: Write wg0.conf for gcp-wg
      copy:
        dest: /etc/wireguard/wg0.conf
        mode: '0600'
        content: |
          [Interface]
          Address    = {{ gcp_wg_ip }}/24
          PrivateKey = {{ hostvars[groups['wg_gcp'][0]]['wg_privkey'] }}
          ListenPort = {{ wg_port }}

          # tc-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_tc'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_tc'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ tc_wg_ip }}/32, {{ tc_vpc }}
          PersistentKeepalive = 25

          # aws-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_aws'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_aws'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ aws_wg_ip }}/32, {{ aws_vpc }}
          PersistentKeepalive = 25

          # ali-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_ali'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_ali'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ ali_wg_ip }}/32, {{ ali_vpc }}
          PersistentKeepalive = 25

          # azure-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_azure'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_azure'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ azure_wg_ip }}/32, {{ azure_vpc }}
          PersistentKeepalive = 25
      when: inventory_hostname in groups['wg_gcp']
      notify: restart wg0

    # ---- azure-wg config ----
    - name: Write wg0.conf for azure-wg
      copy:
        dest: /etc/wireguard/wg0.conf
        mode: '0600'
        content: |
          [Interface]
          Address    = {{ azure_wg_ip }}/24
          PrivateKey = {{ hostvars[groups['wg_azure'][0]]['wg_privkey'] }}
          ListenPort = {{ wg_port }}

          # tc-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_tc'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_tc'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ tc_wg_ip }}/32, {{ tc_vpc }}
          PersistentKeepalive = 25

          # aws-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_aws'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_aws'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ aws_wg_ip }}/32, {{ aws_vpc }}
          PersistentKeepalive = 25

          # ali-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_ali'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_ali'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ ali_wg_ip }}/32, {{ ali_vpc }}
          PersistentKeepalive = 25

          # gcp-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_gcp'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_gcp'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ gcp_wg_ip }}/32, {{ gcp_vpc }}
          PersistentKeepalive = 25
      when: inventory_hostname in groups['wg_azure']
      notify: restart wg0

    - name: Enable and start wg-quick@wg0
      systemd:
        name: wg-quick@wg0
        enabled: yes
        state: started

    - name: Verify WireGuard interface is up
      command: wg show wg0
      register: wg_status
      changed_when: false

    - name: Show wg0 status
      debug:
        msg: "{{ wg_status.stdout_lines }}"

# -------------------------------------------------------
# Play 3: Connectivity test — each wg node pings all others
#         via WireGuard tunnel IP and VPC private IP
#
# WireGuard IPs:  tc=10.200.0.1  aws=10.200.0.2  ali=10.200.0.3
#                 gcp=10.200.0.4  azure=10.200.0.5
# VPC private IP: tc=10.202.1.102 aws=10.201.1.102 ali=10.203.1.102
#                 gcp=10.204.1.102 azure=10.205.1.102
# -------------------------------------------------------
- name: Cross-cloud connectivity test
  hosts: wg_nodes
  become: true
  vars:
    tc_wg_ip:    "10.200.0.1"
    aws_wg_ip:   "10.200.0.2"
    ali_wg_ip:   "10.200.0.3"
    gcp_wg_ip:   "10.200.0.4"
    azure_wg_ip: "10.200.0.5"
    tc_wg_private:    "10.202.1.102"
    aws_wg_private:   "10.201.1.102"
    ali_wg_private:   "10.203.1.102"
    gcp_wg_private:   "10.204.1.102"
    azure_wg_private: "10.205.1.102"
  tasks:
    # ---- from tc-wg ----
    - name: "[tc-wg] ping aws-wg via WireGuard tunnel"
      command: ping -c 3 -W 3 {{ aws_wg_ip }}
      when: inventory_hostname in groups['wg_tc']
      register: tc_ping_aws_wg
      changed_when: false

    - name: "[tc-wg] ping ali-wg via WireGuard tunnel"
      command: ping -c 3 -W 3 {{ ali_wg_ip }}
      when: inventory_hostname in groups['wg_tc']
      register: tc_ping_ali_wg
      changed_when: false

    - name: "[tc-wg] ping gcp-wg via WireGuard tunnel"
      command: ping -c 3 -W 3 {{ gcp_wg_ip }}
      when: inventory_hostname in groups['wg_tc']
      register: tc_ping_gcp_wg
      changed_when: false

    - name: "[tc-wg] ping azure-wg via WireGuard tunnel"
      command: ping -c 3 -W 3 {{ azure_wg_ip }}
