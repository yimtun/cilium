apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cilium
  namespace: kube-system
  labels:
    app: cilium
spec:
  selector:
    matchLabels:
      app: cilium
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: cilium
    spec:
      hostNetwork: true
      hostPID: true
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      initContainers:
        - name: install-cni
          image: docker.io/yimtune/cilium:tencentcloud-dev
          imagePullPolicy: Always
          command: ["/install-plugin.sh"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
            - name: cni-conf
              mountPath: /host/etc/cni/net.d
        - name: clean-cilium-state
          image: docker.io/yimtune/cilium:tencentcloud-dev
          imagePullPolicy: Always
          command: ["/init-container.sh"]
          securityContext:
            privileged: true
          env:
            - name: CILIUM_ALL_STATE
              valueFrom:
                configMapKeyRef:
                  name: cilium-config
                  key: clean-cilium-state
                  optional: true
            - name: CILIUM_BPF_STATE
              valueFrom:
                configMapKeyRef:
                  name: cilium-config
                  key: clean-cilium-bpf-state
                  optional: true
          volumeMounts:
            - name: bpf-maps
              mountPath: /sys/fs/bpf
            - name: cilium-run
              mountPath: /var/run/cilium
      containers:
        - name: cilium-agent
          image: docker.io/yimtune/cilium:tencentcloud-dev
          imagePullPolicy: Always
          command: ["cilium-agent"]
          args:
            - --config-dir=/tmp/cilium/config-map
            - --k8s-kubeconfig-path=/etc/kubernetes/admin.conf
            - --local-router-ipv4=169.254.0.1
          securityContext:
            privileged: true
          lifecycle:
            preStop:
              exec:
                command:
                  - /cni-uninstall.sh
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CILIUM_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: bpf-maps
              mountPath: /sys/fs/bpf
            - name: cilium-run
              mountPath: /var/run/cilium
            - name: cni-bin
              mountPath: /host/opt/cni/bin
            - name: cni-conf
              mountPath: /host/etc/cni/net.d
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: xtables-lock
              mountPath: /run/xtables.lock
            - name: cilium-config-path
              mountPath: /tmp/cilium/config-map
              readOnly: true
            - name: admin-kubeconfig
              mountPath: /etc/kubernetes/admin.conf
              readOnly: true
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 9879
              scheme: HTTP
              httpHeaders:
                - name: brief
                  value: "true"
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 9879
              scheme: HTTP
              httpHeaders:
                - name: brief
                  value: "true"
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cilium-run
          hostPath:
            path: /var/run/cilium
            type: DirectoryOrCreate
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: cilium-config-path
          configMap:
            name: cilium-config
        - name: admin-kubeconfig
          hostPath:
            path: /etc/kubernetes/admin.conf
            type: File
