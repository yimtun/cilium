---
- name: Bootstrap root SSH access
  hosts: k8s_aws_bootstrap,k8s_gcp_bootstrap
  become: true
  tasks:
    - name: Copy authorized_keys to root
      shell: |
        mkdir -p /root/.ssh
        cp /home/rocky/.ssh/authorized_keys /root/.ssh/
        chown -R root:root /root/.ssh
        chmod 700 /root/.ssh
        chmod 600 /root/.ssh/authorized_keys

    - name: Enable root SSH login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin yes'
        state: present

    - name: Restart sshd
      systemd:
        name: sshd
        state: restarted

    - name: Verify root SSH access
      local_action: shell ssh -i ../terraform/my_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@{{ ansible_host }} echo ok
      become: false
      register: result
      retries: 5
      delay: 3
      until: result.rc == 0

- name: Bootstrap root SSH access on Azure instances (almalinux user)
  hosts: k8s_azure_bootstrap
  become: true
  tasks:
    - name: Copy authorized_keys to root
      shell: |
        mkdir -p /root/.ssh
        cp /home/almalinux/.ssh/authorized_keys /root/.ssh/
        chown -R root:root /root/.ssh
        chmod 700 /root/.ssh
        chmod 600 /root/.ssh/authorized_keys

    - name: Enable root SSH login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin yes'
        state: present

    - name: Restart sshd
      systemd:
        name: sshd
        state: restarted

    - name: Verify root SSH access
      local_action: shell ssh -i ../terraform/my_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@{{ ansible_host }} echo ok
      become: false
      register: result
      retries: 5
      delay: 3
      until: result.rc == 0

- name: Common k8s setup
  hosts: k8s_aws,k8s_ali,k8s_tc,k8s_gcp,k8s_azure
  become: true
  tasks:
    - name: Configure sysctl
      blockinfile:
        path: /etc/sysctl.conf
        block: |
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_max_tw_buckets = 20480
          net.ipv4.tcp_max_syn_backlog = 20480
          net.core.netdev_max_backlog = 262144
          net.ipv4.tcp_fin_timeout = 20
          net.ipv4.conf.all.rp_filter = 0
          net.ipv4.conf.default.rp_filter = 0
          net.ipv4.conf.eth0.rp_filter = 0
          net.ipv4.conf.eth1.rp_filter = 0
        create: yes

    - name: Configure k8s sysctl
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1

    - name: Load br_netfilter on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          br_netfilter

    - name: Load br_netfilter now
      command: modprobe br_netfilter

    - name: Apply sysctl
      command: sysctl --system

    - name: Deploy NetworkManager config to unmanage ENI interfaces
      copy:
        src: files/99-cilium.conf
        dest: /etc/NetworkManager/conf.d/99-cilium.conf
        mode: '0644'

    - name: Reload NetworkManager
      systemd:
        name: NetworkManager
        state: reloaded

    # NetworkManager reload briefly disrupts connectivity; without this the next
    # task can hit a truncated TLS handshake (ASN1: NOT_ENOUGH_DATA).
    - name: Wait for network to settle after NetworkManager reload
      wait_for_connection:
        delay: 5
        timeout: 60

    - name: Add Docker CE repo
      get_url:
        url: https://mirrors.aliyun.com/docker-ce/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
      register: docker_repo
      retries: 5
      delay: 5
      until: docker_repo is succeeded

    - name: Install containerd
      yum:
        name:
          - yum-utils
          - containerd.io
        state: present

    - name: Generate containerd config
      shell: containerd config default > /etc/containerd/config.toml

    - name: Enable SystemdCgroup
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Add Kubernetes yum repo
      copy:
        dest: /etc/yum.repos.d/k8s.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://mirrors.aliyun.com/kubernetes-new/core/stable/v1.31/rpm/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0

    - name: Install kubelet kubeadm kubectl 1.31.0
      yum:
        name:
          - kubelet-1.31.0
          - kubeadm-1.31.0
          - kubectl-1.31.0
        state: present

    - name: Enable kubelet
      systemd:
        name: kubelet
        enabled: true


- name: Initialize Kubernetes master
  hosts: k8s_aws
  become: true
  tasks:
    - name: kubeadm init
      command: >
        kubeadm init
        --kubernetes-version=v1.31.0
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
        --service-cidr=10.96.0.0/24
        --apiserver-cert-extra-sans={{ ansible_host }}
        --skip-phases=addon/kube-proxy
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create .kube directory
      file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: '0755'

    - name: Copy admin.conf to kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ ansible_env.HOME }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_env.USER }}"
        group: "{{ ansible_env.USER }}"
        mode: '0600'

    - name: Remove control-plane taint
      command: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      failed_when: false

# -------------------------------------------------------
# Play: Fetch join command from master
# -------------------------------------------------------
- name: Get kubeadm join command from master
  hosts: k8s_aws
  become: true
  tasks:
    - name: Generate join token and command
      command: kubeadm token create --print-join-command
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: join_command
      changed_when: true

    - name: Store join command as fact
      set_fact:
        kubeadm_join_cmd: "{{ join_command.stdout }}"

# -------------------------------------------------------
# Play: Join TC and Ali nodes as workers
# Worker 节点通过 WireGuard mesh 访问 master 10.201.1.101:6443
# --node-ip 用各自的内网 IP，kubelet 注册到 apiserver 的地址正确
# -------------------------------------------------------
- name: Join worker nodes (TC, Ali, GCP and Azure) to cluster
  hosts: k8s_tc,k8s_ali,k8s_gcp,k8s_azure
  become: true
  tasks:
    - name: Set kubelet node-ip to private IP
      copy:
        dest: /etc/sysconfig/kubelet
        content: |
          KUBELET_EXTRA_ARGS=--node-ip={{ ansible_default_ipv4.address }}

    - name: Join cluster via kubeadm
      command: "{{ hostvars[groups['k8s_aws'][0]]['kubeadm_join_cmd'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

    - name: Restart kubelet with updated node-ip
      systemd:
        name: kubelet
        state: restarted
        enabled: true

- name: Wait for worker nodes to register
  hosts: k8s_aws
  become: true
  tasks:
    - name: Wait for all nodes to be registered
      command: kubectl get nodes
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: nodes_output
      until: nodes_output.stdout_lines | length >= 5
      retries: 20
      delay: 10
      changed_when: false

    - name: Show cluster nodes
      debug:
        msg: "{{ nodes_output.stdout_lines }}"

- name: Install Cilium via Helm
  hosts: k8s_aws
  become: true
  vars:
    cilium_version: "1.19.0"
    cilium_image_repo: "docker.io/yimtune/cilium"
    operator_image_repo: "docker.io/yimtune/operator-multicloud"
    cilium_image_tag: "multicloud-dev"
    cilium_ipam_mode: "multicloud"
  tasks:
    - name: Install Helm
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Add Cilium Helm repo
      command: helm repo add cilium https://helm.cilium.io/
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Copy cloud credentials secret
      copy:
        src: files/cloud-credentials.yaml
        dest: /tmp/cloud-credentials.yaml
        mode: '0600'

    - name: Apply cloud credentials secret
      command: kubectl apply -f /tmp/cloud-credentials.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Install Cilium with topology-aware routing
      command: >
        helm upgrade --install cilium cilium/cilium
        --version {{ cilium_version }}
        --namespace kube-system
        --set ipam.mode={{ cilium_ipam_mode }}
        --set image.repository={{ cilium_image_repo }}
        --set image.tag={{ cilium_image_tag }}
        --set operator.image.override={{ operator_image_repo }}:{{ cilium_image_tag }}
        --set operator.image.useDigest=false
        --set "operator.extraArgs={--ipam=multicloud}"
        --set envoy.enabled=false
        --set image.useDigest=false
        --set operator.replicas=1
        --set "operator.nodeSelector.kubernetes\.io/hostname=ip-10-201-1-101\.ap-northeast-2\.compute\.internal"
        --set kubeProxyReplacement=true
        --set k8sServiceHost=10.201.1.101
        --set k8sServicePort=6443
        --set routingMode=native
        --set endpointRoutes.enabled=true
        --set ipv4NativeRoutingCIDR="10.200.0.0/13"
        --set enableIPv4Masquerade=false
        --set loadBalancer.serviceTopology=true
        --set enableK8sEndpointSlice=true
        --set bpf.hostLegacyRouting=true
        --set "operator.extraEnv[0].name=AWS_ACCESS_KEY_ID"
        --set "operator.extraEnv[0].valueFrom.secretKeyRef.name=cloud-credentials"
        --set "operator.extraEnv[0].valueFrom.secretKeyRef.key=AWS_ACCESS_KEY_ID"
        --set "operator.extraEnv[1].name=AWS_SECRET_ACCESS_KEY"
        --set "operator.extraEnv[1].valueFrom.secretKeyRef.name=cloud-credentials"
        --set "operator.extraEnv[1].valueFrom.secretKeyRef.key=AWS_SECRET_ACCESS_KEY"
        --set "operator.extraEnv[2].name=ALIBABA_CLOUD_ACCESS_KEY_ID"
        --set "operator.extraEnv[2].valueFrom.secretKeyRef.name=cloud-credentials"
        --set "operator.extraEnv[2].valueFrom.secretKeyRef.key=ALIBABA_CLOUD_ACCESS_KEY_ID"
        --set "operator.extraEnv[3].name=ALIBABA_CLOUD_ACCESS_KEY_SECRET"
        --set "operator.extraEnv[3].valueFrom.secretKeyRef.name=cloud-credentials"
        --set "operator.extraEnv[3].valueFrom.secretKeyRef.key=ALIBABA_CLOUD_ACCESS_KEY_SECRET"
        --set "operator.extraEnv[4].name=TENCENTCLOUD_SECRET_ID"
        --set "operator.extraEnv[4].valueFrom.secretKeyRef.name=cloud-credentials"
        --set "operator.extraEnv[4].valueFrom.secretKeyRef.key=TENCENTCLOUD_SECRET_ID"
        --set "operator.extraEnv[5].name=TENCENTCLOUD_SECRET_KEY"
        --set "operator.extraEnv[5].valueFrom.secretKeyRef.name=cloud-credentials"
        --set "operator.extraEnv[5].valueFrom.secretKeyRef.key=TENCENTCLOUD_SECRET_KEY"
        --set "operator.extraEnv[6].name=GOOGLE_CREDENTIALS_JSON"
        --set "operator.extraEnv[6].valueFrom.secretKeyRef.name=cloud-credentials"
        --set "operator.extraEnv[6].valueFrom.secretKeyRef.key=GOOGLE_CREDENTIALS_JSON"
        --set "operator.extraEnv[7].name=AZURE_CREDENTIALS_JSON"
        --set "operator.extraEnv[7].valueFrom.secretKeyRef.name=cloud-credentials"
        --set "operator.extraEnv[7].valueFrom.secretKeyRef.key=AZURE_CREDENTIALS_JSON"
        --set "operator.extraEnv[8].name=AZURE_RESOURCE_GROUP"
        --set "operator.extraEnv[8].valueFrom.secretKeyRef.name=cloud-credentials"
        --set "operator.extraEnv[8].valueFrom.secretKeyRef.key=AZURE_RESOURCE_GROUP"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Fix operator command
      command: >
        kubectl patch deployment cilium-operator -n kube-system --type=json
        -p='[{"op":"replace","path":"/spec/template/spec/containers/0/command/0","value":"cilium-operator-multicloud"}]'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Wait for cilium-agent ready
      command: kubectl -n kube-system get daemonset cilium -o jsonpath='{.status.numberReady}'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cilium_ready
      until: cilium_ready.stdout | int >= 5
      retries: 60
      delay: 10
      changed_when: false

