          [VPC priv]  -> tc-wg    ({{ tc_wg_private }}): {{ 'OK' if aws_ping_tc_priv.rc == 0 else 'FAIL' }}
          [VPC priv]  -> ali-wg   ({{ ali_wg_private }}): {{ 'OK' if aws_ping_ali_priv.rc == 0 else 'FAIL' }}
          [VPC priv]  -> gcp-wg   ({{ gcp_wg_private }}): {{ 'OK' if aws_ping_gcp_priv.rc == 0 else 'FAIL' }}
          [VPC priv]  -> azure-wg ({{ azure_wg_private }}): {{ 'OK' if aws_ping_azure_priv.rc == 0 else 'FAIL' }}
          {% elif inventory_hostname in groups['wg_ali'] %}
