# -------------------------------------------------------
# Play 4: k8s 节点跨云内网连通性测试
# -------------------------------------------------------
- name: k8s node internal connectivity test
  hosts: k8s_tc,k8s_ali,k8s_aws,k8s_gcp,k8s_azure
  become: true
  vars:
    aws_k8s:       "10.201.1.101"
    tc_k8s:        "10.202.1.101"
    ali_k8s:       "10.203.1.101"
    gcp_k8s:       "10.204.1.101"
    azure_k8s:     "10.205.1.101"
    gcp_k8s_nic1:  "10.204.2.2"
    azure_k8s_nic1: "10.205.2.4"
  tasks:
    - name: Ping all other k8s nodes (nic0)
      command: ping -c 3 -W 3 {{ item }}
      loop: >-
        {{
          ([aws_k8s, tc_k8s, ali_k8s, gcp_k8s, azure_k8s] | reject('eq',
            ansible_default_ipv4.address) | list)
        }}
      changed_when: false
