---
# WireGuard mesh installation across 3 clouds
#
# WireGuard tunnel network: 10.200.0.0/24
#   tc-wg  wg0: 10.200.0.1   vpc: 10.202.0.0/16
#   aws-wg wg0: 10.200.0.2   vpc: 10.201.0.0/16
#   ali-wg wg0: 10.200.0.3   vpc: 10.203.0.0/16
#
# Usage:
#   ansible-playbook -i hosts.ini WireGuard_install.yaml

# -------------------------------------------------------
# Play 0: Bootstrap root SSH access on AWS instances
# AWS AMI 默认只允许 rocky 用户登录，需先以 rocky 身份
# 把 authorized_keys 复制到 root，后续统一用 root 操作
# -------------------------------------------------------
- name: Bootstrap root SSH access on AWS instances
  hosts: aws_bootstrap
  become: true
  tasks:
    - name: Ensure /root/.ssh directory
      file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Copy authorized_keys to root
      copy:
        src: /home/rocky/.ssh/authorized_keys
        dest: /root/.ssh/authorized_keys
        remote_src: yes
        owner: root
        group: root
        mode: '0600'

    - name: Verify root SSH access
      local_action:
        module: shell
        cmd: >
          ssh -i ../terraform/my_key
          -o StrictHostKeyChecking=no
          -o ConnectTimeout=10
          root@{{ ansible_host }} echo ok
      become: false
      register: result
      retries: 5
      delay: 3
      until: result.rc == 0

# -------------------------------------------------------
# Play 1: Install packages and generate key pairs
# -------------------------------------------------------
- name: Install WireGuard and generate keys
  hosts: wg_nodes
  become: true
  vars:
    wg_port: 51820
  tasks:
    - name: Install wireguard-tools
      yum:
        name: wireguard-tools
        state: present

    - name: Persist IP forwarding
      copy:
        dest: /etc/sysctl.d/99-wireguard.conf
        content: |
          net.ipv4.ip_forward = 1

    - name: Enable IP forwarding (runtime)
      command: sysctl -w net.ipv4.ip_forward=1
      changed_when: false

    - name: Ensure /etc/wireguard directory
      file:
        path: /etc/wireguard
        state: directory
        mode: '0700'

    - name: Generate private key
      shell: wg genkey > /etc/wireguard/privatekey
      args:
        creates: /etc/wireguard/privatekey

    - name: Secure private key
      file:
        path: /etc/wireguard/privatekey
        mode: '0600'

    - name: Derive public key from private key
      shell: wg pubkey < /etc/wireguard/privatekey > /etc/wireguard/publickey
      args:
        creates: /etc/wireguard/publickey

    - name: Read private key
      slurp:
        src: /etc/wireguard/privatekey
      register: _privkey

    - name: Read public key
      slurp:
        src: /etc/wireguard/publickey
      register: _pubkey

    - name: Store key facts (available to Play 2 via hostvars)
      set_fact:
        wg_privkey: "{{ _privkey.content | b64decode | trim }}"
        wg_pubkey:  "{{ _pubkey.content  | b64decode | trim }}"

#    - name: Open WireGuard UDP port in firewalld
#      shell: |
#        firewall-cmd --add-port={{ wg_port }}/udp --permanent
#        firewall-cmd --reload
#      ignore_errors: true   # firewalld may not be running

# -------------------------------------------------------
# Play 2: Write wg0.conf and start WireGuard
# Keys from Play 1 are accessible via hostvars[]
# -------------------------------------------------------
- name: Configure wg0 and start WireGuard
  hosts: wg_nodes
  become: true
  vars:
    wg_port: 51820
    # WireGuard mesh IPs
    tc_wg_ip:  "10.200.0.1"
    aws_wg_ip: "10.200.0.2"
    ali_wg_ip: "10.200.0.3"
    # Cloud VPC CIDRs
    tc_vpc:  "10.202.0.0/16"
    aws_vpc: "10.201.0.0/16"
    ali_vpc: "10.203.0.0/16"
  handlers:
    - name: restart wg0
      systemd:
        name: wg-quick@wg0
        state: restarted
  tasks:
    # ---- tc-wg config ----
    - name: Write wg0.conf for tc-wg
      copy:
        dest: /etc/wireguard/wg0.conf
        mode: '0600'
        content: |
          [Interface]
          Address    = {{ tc_wg_ip }}/24
          PrivateKey = {{ hostvars[groups['wg_tc'][0]]['wg_privkey'] }}
          ListenPort = {{ wg_port }}

          # aws-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_aws'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_aws'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ aws_wg_ip }}/32, {{ aws_vpc }}
          PersistentKeepalive = 25

          # ali-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_ali'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_ali'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ ali_wg_ip }}/32, {{ ali_vpc }}
          PersistentKeepalive = 25
      when: inventory_hostname in groups['wg_tc']
      notify: restart wg0

    # ---- aws-wg config ----
    - name: Write wg0.conf for aws-wg
      copy:
        dest: /etc/wireguard/wg0.conf
        mode: '0600'
        content: |
          [Interface]
          Address    = {{ aws_wg_ip }}/24
          PrivateKey = {{ hostvars[groups['wg_aws'][0]]['wg_privkey'] }}
          ListenPort = {{ wg_port }}

          # tc-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_tc'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_tc'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ tc_wg_ip }}/32, {{ tc_vpc }}
          PersistentKeepalive = 25

          # ali-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_ali'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_ali'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ ali_wg_ip }}/32, {{ ali_vpc }}
          PersistentKeepalive = 25
      when: inventory_hostname in groups['wg_aws']
      notify: restart wg0

    # ---- ali-wg config ----
    - name: Write wg0.conf for ali-wg
      copy:
        dest: /etc/wireguard/wg0.conf
        mode: '0600'
        content: |
          [Interface]
          Address    = {{ ali_wg_ip }}/24
          PrivateKey = {{ hostvars[groups['wg_ali'][0]]['wg_privkey'] }}
          ListenPort = {{ wg_port }}

          # tc-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_tc'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_tc'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ tc_wg_ip }}/32, {{ tc_vpc }}
          PersistentKeepalive = 25

          # aws-wg
          [Peer]
          PublicKey           = {{ hostvars[groups['wg_aws'][0]]['wg_pubkey'] }}
          Endpoint            = {{ groups['wg_aws'][0] }}:{{ wg_port }}
          AllowedIPs          = {{ aws_wg_ip }}/32, {{ aws_vpc }}
          PersistentKeepalive = 25
      when: inventory_hostname in groups['wg_ali']
      notify: restart wg0

    - name: Enable and start wg-quick@wg0
      systemd:
        name: wg-quick@wg0
        enabled: yes
        state: started

    - name: Verify WireGuard interface is up
      command: wg show wg0
      register: wg_status
      changed_when: false

    - name: Show wg0 status
      debug:
        msg: "{{ wg_status.stdout_lines }}"

# -------------------------------------------------------
# Play 3: Connectivity test — each wg node pings the
#         other two via WireGuard tunnel IP and VPC private IP
#
# WireGuard IPs:  tc=10.200.0.1  aws=10.200.0.2  ali=10.200.0.3
# VPC private IP: tc=10.202.1.102 aws=10.201.1.102 ali=10.203.1.102
# -------------------------------------------------------
- name: Cross-cloud connectivity test
  hosts: wg_nodes
  become: true
  vars:
    # WireGuard tunnel IPs
    tc_wg_ip:  "10.200.0.1"
    aws_wg_ip: "10.200.0.2"
    ali_wg_ip: "10.200.0.3"
    # VPC private IPs of wg nodes
    tc_wg_private:  "10.202.1.102"
    aws_wg_private: "10.201.1.102"
    ali_wg_private: "10.203.1.102"
  tasks:
    # ---- from tc-wg ----
    - name: "[tc-wg] ping aws-wg via WireGuard tunnel (10.200.0.2)"
      command: ping -c 3 -W 3 {{ aws_wg_ip }}
      when: inventory_hostname in groups['wg_tc']
      register: tc_ping_aws_wg
      changed_when: false

    - name: "[tc-wg] ping ali-wg via WireGuard tunnel (10.200.0.3)"
      command: ping -c 3 -W 3 {{ ali_wg_ip }}
      when: inventory_hostname in groups['wg_tc']
      register: tc_ping_ali_wg
      changed_when: false

    - name: "[tc-wg] ping aws-wg via VPC private IP (10.201.1.102)"
      command: ping -c 3 -W 3 {{ aws_wg_private }}
      when: inventory_hostname in groups['wg_tc']
      register: tc_ping_aws_priv
      changed_when: false

    - name: "[tc-wg] ping ali-wg via VPC private IP (10.203.1.102)"
      command: ping -c 3 -W 3 {{ ali_wg_private }}
      when: inventory_hostname in groups['wg_tc']
      register: tc_ping_ali_priv
      changed_when: false

    # ---- from aws-wg ----
    - name: "[aws-wg] ping tc-wg via WireGuard tunnel (10.200.0.1)"
      command: ping -c 3 -W 3 {{ tc_wg_ip }}
      when: inventory_hostname in groups['wg_aws']
      register: aws_ping_tc_wg
      changed_when: false

    - name: "[aws-wg] ping ali-wg via WireGuard tunnel (10.200.0.3)"
      command: ping -c 3 -W 3 {{ ali_wg_ip }}
      when: inventory_hostname in groups['wg_aws']
      register: aws_ping_ali_wg
      changed_when: false

    - name: "[aws-wg] ping tc-wg via VPC private IP (10.202.1.102)"
      command: ping -c 3 -W 3 {{ tc_wg_private }}
      when: inventory_hostname in groups['wg_aws']
      register: aws_ping_tc_priv
      changed_when: false

    - name: "[aws-wg] ping ali-wg via VPC private IP (10.203.1.102)"
      command: ping -c 3 -W 3 {{ ali_wg_private }}
      when: inventory_hostname in groups['wg_aws']
      register: aws_ping_ali_priv
      changed_when: false

    # ---- from ali-wg ----
    - name: "[ali-wg] ping tc-wg via WireGuard tunnel (10.200.0.1)"
      command: ping -c 3 -W 3 {{ tc_wg_ip }}
      when: inventory_hostname in groups['wg_ali']
      register: ali_ping_tc_wg
      changed_when: false

    - name: "[ali-wg] ping aws-wg via WireGuard tunnel (10.200.0.2)"
      command: ping -c 3 -W 3 {{ aws_wg_ip }}
      when: inventory_hostname in groups['wg_ali']
      register: ali_ping_aws_wg
      changed_when: false

    - name: "[ali-wg] ping tc-wg via VPC private IP (10.202.1.102)"
      command: ping -c 3 -W 3 {{ tc_wg_private }}
      when: inventory_hostname in groups['wg_ali']
      register: ali_ping_tc_priv
      changed_when: false

    - name: "[ali-wg] ping aws-wg via VPC private IP (10.201.1.102)"
      command: ping -c 3 -W 3 {{ aws_wg_private }}
      when: inventory_hostname in groups['wg_ali']
      register: ali_ping_aws_priv
      changed_when: false

    # ---- 汇总结果 ----
    - name: Show ping results summary
      debug:
        msg: |
          === {{ inventory_hostname }} connectivity ===
          {% if inventory_hostname in groups['wg_tc'] %}
          [WG tunnel] -> aws-wg ({{ aws_wg_ip }}):  {{ 'OK' if tc_ping_aws_wg.rc == 0 else 'FAIL' }}
          [WG tunnel] -> ali-wg ({{ ali_wg_ip }}):  {{ 'OK' if tc_ping_ali_wg.rc == 0 else 'FAIL' }}
          [VPC priv]  -> aws-wg ({{ aws_wg_private }}): {{ 'OK' if tc_ping_aws_priv.rc == 0 else 'FAIL' }}
          [VPC priv]  -> ali-wg ({{ ali_wg_private }}): {{ 'OK' if tc_ping_ali_priv.rc == 0 else 'FAIL' }}
          {% elif inventory_hostname in groups['wg_aws'] %}
          [WG tunnel] -> tc-wg  ({{ tc_wg_ip }}):  {{ 'OK' if aws_ping_tc_wg.rc == 0 else 'FAIL' }}
          [WG tunnel] -> ali-wg ({{ ali_wg_ip }}):  {{ 'OK' if aws_ping_ali_wg.rc == 0 else 'FAIL' }}
          [VPC priv]  -> tc-wg  ({{ tc_wg_private }}): {{ 'OK' if aws_ping_tc_priv.rc == 0 else 'FAIL' }}
          [VPC priv]  -> ali-wg ({{ ali_wg_private }}): {{ 'OK' if aws_ping_ali_priv.rc == 0 else 'FAIL' }}
          {% elif inventory_hostname in groups['wg_ali'] %}
          [WG tunnel] -> tc-wg  ({{ tc_wg_ip }}):  {{ 'OK' if ali_ping_tc_wg.rc == 0 else 'FAIL' }}
          [WG tunnel] -> aws-wg ({{ aws_wg_ip }}):  {{ 'OK' if ali_ping_aws_wg.rc == 0 else 'FAIL' }}
          [VPC priv]  -> tc-wg  ({{ tc_wg_private }}): {{ 'OK' if ali_ping_tc_priv.rc == 0 else 'FAIL' }}
          [VPC priv]  -> aws-wg ({{ aws_wg_private }}): {{ 'OK' if ali_ping_aws_priv.rc == 0 else 'FAIL' }}
          {% endif %}

# -------------------------------------------------------
# Play 4: k8s 节点跨云内网连通性测试
# 每个节点 ping 另外两个 k8s 节点的内网 IP，验证 VPC 路由
# 经由各自的 WG 网关转发
# -------------------------------------------------------
- name: k8s node internal connectivity test
  hosts: k8s_tc,k8s_ali,k8s_aws
  become: true
  vars:
    aws_k8s: "10.201.1.101"
    tc_k8s:  "10.202.1.101"
    ali_k8s: "10.203.1.101"
  tasks:
    - name: Ping all other k8s nodes
      command: ping -c 3 -W 3 {{ item }}
      loop: >-
        {{
          ([aws_k8s, tc_k8s, ali_k8s] | reject('eq',
            ansible_default_ipv4.address) | list)
        }}
      changed_when: false
