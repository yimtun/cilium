---
- name: Topology-aware routing test
  hosts: k8s_aws
  become: true
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    test_ns: topology-test

  tasks:
    # -------------------------------------------------------
    # Step 0: 从 CiliumNode spec.multi-cloud 自动推导拓扑标签并打到 k8s node
    # zone   = {cloud}-{region}-{vpc-id}  (Level 1 同VPC精确匹配)
    # region = {cloud}-{region}           (Level 2/3 前缀匹配)
    # -------------------------------------------------------
    - name: Label nodes from CiliumNode multi-cloud spec
      shell: |
        kubectl get ciliumnode -o json | jq -r '
          .items[] |
          .metadata.name as $node |
          .spec["multi-cloud"] as $mc |
          select($mc != null and $mc["cloud-provider"] != "") |
          [
            $node,
            $mc["cloud-provider"],
            ($mc["cloud-provider"] + "-" + $mc["region"] + "-" + ($mc["vpc-id"] | .[0:8])),
            ($mc["cloud-provider"] + "-" + $mc["region"])
          ] | @tsv
        ' | while IFS=$'\t' read -r node cloud zone region; do
            kubectl label node "$node" \
              node.cilium.io/cloud-provider="$cloud" \
              topology.kubernetes.io/zone="$zone" \
              topology.kubernetes.io/region="$region" \
              --overwrite
          done
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    # -------------------------------------------------------
    # Step 1: 部署 echo server（每节点一个副本）+ 拓扑感知 Service
    # -------------------------------------------------------
    - name: Apply echo server and service
      command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: {{ test_ns }}
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: echo-server
            namespace: {{ test_ns }}
          spec:
            replicas: 5
            selector:
              matchLabels:
                app: echo-server
            template:
              metadata:
                labels:
                  app: echo-server
              spec:
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app: echo-server
                      topologyKey: kubernetes.io/hostname
                containers:
                - name: echo
                  image: busybox
                  env:
                  - name: NODE_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.nodeName
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  command:
                  - sh
                  - -c
                  - |
                    mkdir -p /www/cgi-bin
                    echo "node=$NODE_NAME pod=$POD_NAME" > /www/index.html
                    # busybox httpd exports REMOTE_ADDR to cgi-bin scripts, so a client can
                    # check whether its source IP survived the path (see the SNAT probe below).
                    printf '#!/bin/sh\necho "Content-Type: text/plain"\necho\necho "node=$NODE_NAME pod=$POD_NAME client=$REMOTE_ADDR"\n' > /www/cgi-bin/whoami
                    chmod +x /www/cgi-bin/whoami
                    httpd -f -p 8080 -h /www
                  ports:
                  - containerPort: 8080
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: echo-svc
            namespace: {{ test_ns }}
          spec:
            selector:
              app: echo-server
            trafficDistribution: PreferClose
            ports:
            - port: 80
              targetPort: 8080
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    # -------------------------------------------------------
    # Step 2: 等待 echo-server 3 个副本全部 Ready
    # -------------------------------------------------------
    - name: Wait for echo-server pods ready
      command: >
        kubectl -n {{ test_ns }} get deployment echo-server
        -o jsonpath='{.status.readyReplicas}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: echo_ready
      until: echo_ready.stdout | int >= 5
      retries: 30
      delay: 10
      changed_when: false

    - name: Show pod distribution across clouds
      command: kubectl -n {{ test_ns }} get pods -o wide
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: pod_dist
      changed_when: false

    - name: Display pod distribution
      debug:
        msg: "{{ pod_dist.stdout_lines }}"

    # -------------------------------------------------------
    # Step 3: 确认 Service 的 trafficDistribution（Cilium 原生就近路由+fallback）
    # -------------------------------------------------------
    - name: Check Service trafficDistribution
      shell: |
        kubectl -n {{ test_ns }} get svc echo-svc -o json | jq -r '
          "trafficDistribution=\(.spec.trafficDistribution // "Cluster")  (PreferClose=就近优先+fallback，Cluster=随机)"
        '
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: svc_policy
      changed_when: false

    - name: Show Service traffic policy
      debug:
        msg: "{{ svc_policy.stdout_lines }}"

    # -------------------------------------------------------
    # Step 4: 获取各云节点名称，准备创建客户端 Job
    # -------------------------------------------------------
    - name: Get node name per cloud
      shell: >
        kubectl get nodes -l node.cilium.io/cloud-provider={{ item }}
        -o jsonpath='{.items[0].metadata.name}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop:
        - aws
        - alibabacloud
        - tencentcloud
        - gcp
        - azure
      register: cloud_nodes
      changed_when: false

    # Reverse lookup used by the assertions below: responses carry a node name,
    # but every expectation is expressed in terms of the cloud it belongs to.
    - name: Build node -> cloud lookup
      set_fact:
        node_cloud: "{{ dict(cloud_nodes.results | map(attribute='stdout') | zip(cloud_nodes.results | map(attribute='item'))) }}"

    # -------------------------------------------------------
    # Step 5: 在每个云的节点上运行客户端 Job，各发 10 次请求
    # -------------------------------------------------------
    - name: Drop leftover client jobs from a previous run (Job templates are immutable)
      command: >
        kubectl -n {{ test_ns }} delete job topology-client-{{ item }}
        --ignore-not-found --wait=true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop:
        - aws
        - alibabacloud
        - tencentcloud
        - gcp
        - azure
      changed_when: false

    - name: Create client job for each cloud
      command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: topology-client-{{ item.item }}
            namespace: {{ test_ns }}
          spec:
            ttlSecondsAfterFinished: 300
            template:
              spec:
                nodeName: {{ item.stdout }}
                restartPolicy: Never
                containers:
                - name: client
                  image: busybox
                  command:
                  - sh
                  - -c
                  - for i in $(seq 1 10); do wget -qO- http://echo-svc/; echo; done
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop: "{{ cloud_nodes.results }}"

    - name: Wait for client jobs to complete
      command: >
        kubectl -n {{ test_ns }} get job topology-client-{{ item }}
        -o jsonpath='{.status.succeeded}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: job_status
      until: job_status.stdout | int >= 1
      retries: 20
      delay: 10
      loop:
        - aws
        - alibabacloud
        - tencentcloud
        - gcp
        - azure
      changed_when: false

    # -------------------------------------------------------
    # Step 6: 读取测试结果，验证就近路由
    # -------------------------------------------------------
    - name: Fetch test results per cloud
      shell: kubectl -n {{ test_ns }} logs job/topology-client-{{ item }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: test_results
      loop:
        - aws
        - alibabacloud
        - tencentcloud
        - gcp
        - azure
      changed_when: false

    - name: Show topology routing results
      debug:
        msg:
          - "=== From {{ item.item }} node (expect only {{ item.item }} endpoint) ==="
          - "{{ item.stdout_lines }}"
      loop: "{{ test_results.results }}"

    # Without this the play only prints results and can never fail on wrong
    # routing -- every scenario below is only as trustworthy as its assertion.
    - name: Assert each client stayed inside its own cloud
      vars:
        expected_node: "{{ (cloud_nodes.results | selectattr('item', 'equalto', item.item) | first).stdout | trim }}"
        hit_nodes: "{{ item.stdout_lines | select('search', '^node=') | map('regex_replace', '^node=(\\S+).*$', '\\1') | list }}"
      assert:
        that:
          - hit_nodes | length == 10
          - hit_nodes | unique | length == 1
          - hit_nodes | first == expected_node
        success_msg: "{{ item.item }}: 10/10 hits on local endpoint {{ expected_node }}"
        fail_msg: >-
          {{ item.item }} client expected all 10 hits on {{ expected_node }},
          got {{ hit_nodes | unique }} across {{ hit_nodes | length }} responses
      loop: "{{ test_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    # -------------------------------------------------------
    # Step 7: 统计命中分布（理想：每云 10/10 命中本云节点）
    # -------------------------------------------------------
    - name: Summarize hit distribution
      shell: |
        echo "=== {{ item }} client hit distribution ==="
        kubectl -n {{ test_ns }} logs job/topology-client-{{ item }} | sort | uniq -c | sort -rn
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: hit_summary
      loop:
        - aws
        - alibabacloud
        - tencentcloud
        - gcp
        - azure
      changed_when: false

    - name: Show hit summary
      debug:
        msg: "{{ item.stdout }}"
      loop: "{{ hit_summary.results }}"

    # -------------------------------------------------------
    # Step 7b: 跨云 Pod-to-Pod 直连，验证源 IP 未被 SNAT
    # 这是整套方案的核心不变量（helm 里 enableIPv4Masquerade=false）。
    # 不能走 Service：PreferClose 会命中本地 endpoint，根本不出云。
    # 所以绕开 Service，从 AWS 节点直接打其余四个云的 Pod IP。
    # -------------------------------------------------------
    - name: Map each cloud to its echo-server pod IP
      shell: |
        kubectl -n {{ test_ns }} get pods -l app=echo-server \
          -o jsonpath='{range .items[*]}{.spec.nodeName}{" "}{.status.podIP}{"\n"}{end}' |
        while read -r node ip; do
          [ -n "$node" ] || continue
          cloud=$(kubectl get node "$node" -o jsonpath='{.metadata.labels.node\.cilium\.io/cloud-provider}')
          echo "$cloud $ip"
        done
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: pod_ip_map
      changed_when: false

    - name: Build probe target list (every cloud except the client's own)
      set_fact:
        srcip_targets: "{{ pod_ip_map.stdout_lines | reject('search', '^aws ') | map('regex_replace', '^(\\S+)\\s+(\\S+)$', '\\1=\\2') | join(' ') }}"

    # A Job's spec.template is immutable, so re-applying an edited probe fails with
    # "field is immutable" whenever a previous run's Job is still around (it lingers
    # if the play aborted before cleanup, or within ttlSecondsAfterFinished).
    - name: Drop any leftover source IP probe from a previous run
      command: kubectl -n {{ test_ns }} delete job srcip-probe --ignore-not-found --wait=true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    - name: Run cross-cloud source IP probe from the AWS node
      command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: srcip-probe
            namespace: {{ test_ns }}
          spec:
            ttlSecondsAfterFinished: 300
            template:
              spec:
                nodeName: {{ (cloud_nodes.results | selectattr('item', 'equalto', 'aws') | first).stdout }}
                restartPolicy: Never
                containers:
                - name: probe
                  image: busybox
                  command:
                  - sh
                  - -c
                  - |
                    mine=$(hostname -i)
                    for t in {{ srcip_targets }}; do
                      cloud=${t%%=*}
                      ip=${t#*=}
                      raw=$(wget -qO- "http://$ip:8080/cgi-bin/whoami" 2>/dev/null | sed -n 's/.*client=\([^ ]*\).*/\1/p')
                      # busybox httpd reports REMOTE_ADDR as an IPv4-mapped IPv6
                      # literal, e.g. "[::ffff:10.201.1.238]". Normalise before comparing.
                      seen=$(echo "$raw" | tr -d '[]' | sed 's/^::ffff://')
                      if [ -z "$raw" ]; then
                        echo "target=$cloud UNREACHABLE mine=$mine"
                      elif [ "$seen" = "$mine" ]; then
                        echo "target=$cloud OK mine=$mine seen=$seen raw=$raw"
                      else
                        echo "target=$cloud SNAT mine=$mine seen=$seen raw=$raw"
                      fi
                    done
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for source IP probe to finish
      command: >
        kubectl -n {{ test_ns }} get job srcip-probe
        -o jsonpath='{.status.succeeded}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: srcip_job
      until: srcip_job.stdout | int >= 1
      retries: 20
      delay: 10
      changed_when: false

    - name: Fetch source IP probe results
      command: kubectl -n {{ test_ns }} logs job/srcip-probe
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: srcip_result
      changed_when: false

    - name: Show source IP probe results
      debug:
        msg:
          - "=== Cross-cloud pod-to-pod source IP (expect OK on every target) ==="
          - "{{ srcip_result.stdout_lines }}"

    - name: Assert source IP was preserved across every cross-cloud hop
      vars:
        probe_lines: "{{ srcip_result.stdout_lines | select('search', '^target=') | list }}"
      assert:
        that:
          - (probe_lines | length) == (srcip_targets.split() | length)
          - probe_lines | select('search', ' SNAT ') | list | length == 0
          - probe_lines | select('search', ' UNREACHABLE ') | list | length == 0
        success_msg: "source IP preserved on all {{ probe_lines | length }} cross-cloud paths"
        fail_msg: >-
          cross-cloud source IP check failed: {{ probe_lines }}
          (SNAT means masquerading is on somewhere; UNREACHABLE means pod-to-pod
          routing is broken for that cloud)

    - name: Clean up source IP probe
      command: kubectl -n {{ test_ns }} delete job srcip-probe --ignore-not-found
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Save topology test results to ConfigMap (for collect_env_info.yaml)
      shell: |
        NS={{ test_ns }}
        RESULT=""
        for cloud in aws alibabacloud tencentcloud gcp azure; do
          job="topology-client-$cloud"
          if kubectl -n $NS get job $job &>/dev/null 2>&1; then
            hits=$(kubectl -n $NS logs job/$job 2>/dev/null | grep -c 'node=' || echo 0)
            node=$(kubectl -n $NS logs job/$job 2>/dev/null | grep 'node=' | head -1 | sed 's/.*node=//;s/ .*//')
            RESULT="${RESULT}${cloud}|${hits}|${node}
        "
          fi
        done
        kubectl -n $NS create configmap topology-test-results \
          --from-literal=results="$RESULT" \
          --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false
      failed_when: false

    # -------------------------------------------------------
    # Step 8: Fallback 测试 A — 本云（AWS）无 pod，验证请求 fallback 到其他云
    # 部署只调度到阿里+腾讯的 echo-server，从 AWS 节点发请求
    # 期望：全部命中阿里或腾讯，不报错
    # -------------------------------------------------------
    - name: Deploy fallback-A echo server (ali + tc only, no aws)
      command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: echo-fallback-a
            namespace: {{ test_ns }}
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: echo-fallback-a
            template:
              metadata:
                labels:
                  app: echo-fallback-a
              spec:
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        # Pin to ali+tc explicitly. "NotIn: [aws]" was written when the
                        # cluster only had aws/ali/tc; with gcp/azure joined, pods drifted
                        # onto the new nodes and this case stopped testing what it claims.
                        - key: node.cilium.io/cloud-provider
                          operator: In
                          values: [alibabacloud, tencentcloud]
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app: echo-fallback-a
                      topologyKey: kubernetes.io/hostname
                containers:
                - name: echo
                  image: busybox
                  env:
                  - name: NODE_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.nodeName
                  command:
                  - sh
                  - -c
                  - mkdir -p /www && echo "node=$NODE_NAME" > /www/index.html && httpd -f -p 8080 -h /www
                  ports:
                  - containerPort: 8080
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: echo-svc-fallback-a
            namespace: {{ test_ns }}
          spec:
            selector:
              app: echo-fallback-a
            trafficDistribution: PreferClose
            ports:
            - port: 80
              targetPort: 8080
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for fallback-A pods ready
      command: >
        kubectl -n {{ test_ns }} get deployment echo-fallback-a
        -o jsonpath='{.status.readyReplicas}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: fa_ready
      until: fa_ready.stdout | int >= 2
      retries: 30
      delay: 10
      changed_when: false

    - name: Show fallback-A pod placement
      shell: kubectl -n {{ test_ns }} get pods -l app=echo-fallback-a -o wide
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: fa_pods
      changed_when: false

    - name: Display fallback-A pod placement
      debug:
        msg: "{{ fa_pods.stdout_lines }}"

    - name: Run fallback-A client from AWS node (expect non-aws endpoint)
      command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: fallback-a-client-aws
            namespace: {{ test_ns }}
          spec:
            ttlSecondsAfterFinished: 300
            template:
              spec:
                nodeName: {{ cloud_nodes.results | selectattr('item', 'equalto', 'aws') | map(attribute='stdout') | first }}
                restartPolicy: Never
                containers:
                - name: client
                  image: busybox
                  command:
                  - sh
                  - -c
                  - for i in $(seq 1 10); do wget -qO- http://echo-svc-fallback-a/ || echo "FAILED"; echo; done
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for fallback-A client job to complete
      command: >
        kubectl -n {{ test_ns }} get job fallback-a-client-aws
        -o jsonpath='{.status.succeeded}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: fa_job_status
      until: fa_job_status.stdout | int >= 1
      retries: 20
      delay: 10
      changed_when: false

    - name: Show fallback-A results (from AWS, no local pod)
      shell: |
        echo "=== Fallback A: AWS client → ali/tc endpoint (expect 10/10 non-aws hits, no FAILED) ==="
        kubectl -n {{ test_ns }} logs job/fallback-a-client-aws | sort | uniq -c | sort -rn
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: fa_result
      changed_when: false

    - name: Display fallback-A results
      debug:
        msg: "{{ fa_result.stdout_lines }}"

    - name: Fetch fallback-A raw hits
      command: kubectl -n {{ test_ns }} logs job/fallback-a-client-aws
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: fa_raw
      changed_when: false

    - name: Assert fallback-A spilled over to ali/tc only
      vars:
        fa_clouds: "{{ fa_raw.stdout_lines | select('search', '^node=') | map('regex_replace', '^node=(\\S+).*$', '\\1') | map('extract', node_cloud) | list }}"
      assert:
        that:
          - fa_clouds | length == 10
          - (fa_clouds | unique | difference(['alibabacloud', 'tencentcloud'])) | length == 0
        success_msg: "fallback-A: 10/10 spilled to {{ fa_clouds | unique | sort }}"
        fail_msg: >-
          fallback-A expected all 10 hits on alibabacloud/tencentcloud,
          got {{ fa_clouds | unique }} across {{ fa_clouds | length }} responses

    # -------------------------------------------------------
    # Step 9: Fallback 测试 B — 只有阿里云有 pod，AWS 和腾讯都需要跨云
    # 期望：AWS 和腾讯的请求全部命中阿里云节点
    # -------------------------------------------------------
    - name: Deploy fallback-B echo server (ali only)
      command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: echo-fallback-b
            namespace: {{ test_ns }}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: echo-fallback-b
            template:
              metadata:
                labels:
                  app: echo-fallback-b
              spec:
                nodeSelector:
                  node.cilium.io/cloud-provider: alibabacloud
                containers:
                - name: echo
                  image: busybox
                  env:
                  - name: NODE_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.nodeName
                  command:
                  - sh
                  - -c
                  - mkdir -p /www && echo "node=$NODE_NAME" > /www/index.html && httpd -f -p 8080 -h /www
                  ports:
                  - containerPort: 8080
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: echo-svc-fallback-b
            namespace: {{ test_ns }}
          spec:
            selector:
              app: echo-fallback-b
            trafficDistribution: PreferClose
            ports:
            - port: 80
              targetPort: 8080
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for fallback-B pod ready
      command: >
        kubectl -n {{ test_ns }} get deployment echo-fallback-b
        -o jsonpath='{.status.readyReplicas}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: fb_ready
      until: fb_ready.stdout | int >= 1
      retries: 30
      delay: 10
      changed_when: false

    - name: Run fallback-B clients from AWS and TC (expect ali endpoint)
      command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: fallback-b-client-{{ item.item }}
            namespace: {{ test_ns }}
          spec:
            ttlSecondsAfterFinished: 300
            template:
              spec:
                nodeName: {{ item.stdout }}
                restartPolicy: Never
                containers:
                - name: client
                  image: busybox
                  command:
                  - sh
                  - -c
                  - for i in $(seq 1 10); do wget -qO- http://echo-svc-fallback-b/ || echo "FAILED"; echo; done
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop: "{{ cloud_nodes.results | selectattr('item', 'in', ['aws', 'tencentcloud']) | list }}"

    - name: Wait for fallback-B client jobs to complete
      command: >
        kubectl -n {{ test_ns }} get job fallback-b-client-{{ item }}
        -o jsonpath='{.status.succeeded}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: fb_job_status
      until: fb_job_status.stdout | int >= 1
      retries: 20
      delay: 10
      loop:
        - aws
        - tencentcloud
      changed_when: false

    - name: Show fallback-B results (aws + tc → ali endpoint)
      shell: |
        echo "=== Fallback B: {{ item }} client → ali endpoint (expect 10/10 ali hits) ==="
        kubectl -n {{ test_ns }} logs job/fallback-b-client-{{ item }} | sort | uniq -c | sort -rn
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: fb_result
      loop:
        - aws
        - tencentcloud
      changed_when: false

    - name: Display fallback-B results
      debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ fb_result.results }}"

    - name: Fetch fallback-B raw hits
      command: kubectl -n {{ test_ns }} logs job/fallback-b-client-{{ item }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: fb_raw
      loop:
        - aws
        - tencentcloud
      changed_when: false

    - name: Assert fallback-B always landed on alibabacloud
      vars:
        fb_clouds: "{{ item.stdout_lines | select('search', '^node=') | map('regex_replace', '^node=(\\S+).*$', '\\1') | map('extract', node_cloud) | list }}"
      assert:
        that:
          - fb_clouds | length == 10
          - fb_clouds | unique == ['alibabacloud']
        success_msg: "fallback-B: {{ item.item }} client → 10/10 alibabacloud"
        fail_msg: >-
          fallback-B expected {{ item.item }} client to hit alibabacloud 10/10,
          got {{ fb_clouds | unique }} across {{ fb_clouds | length }} responses
      loop: "{{ fb_raw.results }}"
      loop_control:
        label: "{{ item.item }}"

    # -------------------------------------------------------
    # Step 9b: Fallback 测试 C — 只有 GCP 和 Azure 有 pod
    # GCP 的 alias IP 和 Azure 的 ipConfiguration 是最新、验证最少的两条
    # 数据面路径，之前只在"就近命中"场景出现过，没进过跨云外溢场景。
    # -------------------------------------------------------
    - name: Deploy fallback-C echo server (gcp + azure only)
      command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: echo-fallback-c
            namespace: {{ test_ns }}
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: echo-fallback-c
            template:
              metadata:
                labels:
                  app: echo-fallback-c
              spec:
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - key: node.cilium.io/cloud-provider
                          operator: In
                          values: [gcp, azure]
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app: echo-fallback-c
                      topologyKey: kubernetes.io/hostname
                containers:
                - name: echo
                  image: busybox
                  env:
                  - name: NODE_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.nodeName
                  command:
                  - sh
                  - -c
                  - mkdir -p /www && echo "node=$NODE_NAME" > /www/index.html && httpd -f -p 8080 -h /www
                  ports:
                  - containerPort: 8080
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: echo-svc-fallback-c
            namespace: {{ test_ns }}
          spec:
            selector:
              app: echo-fallback-c
            trafficDistribution: PreferClose
            ports:
            - port: 80
              targetPort: 8080
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for fallback-C pods ready
      command: >
        kubectl -n {{ test_ns }} get deployment echo-fallback-c
        -o jsonpath='{.status.readyReplicas}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: fc_ready
      until: fc_ready.stdout | int >= 2
      retries: 30
      delay: 10
      changed_when: false

    - name: Drop leftover fallback-C client jobs
      command: >
        kubectl -n {{ test_ns }} delete job fallback-c-client-{{ item }}
        --ignore-not-found --wait=true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop:
        - aws
        - alibabacloud
        - tencentcloud
      changed_when: false

    - name: Run fallback-C clients from aws, ali and tc (expect gcp/azure endpoint)
      command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: fallback-c-client-{{ item.item }}
            namespace: {{ test_ns }}
          spec:
            ttlSecondsAfterFinished: 300
            template:
              spec:
                nodeName: {{ item.stdout }}
                restartPolicy: Never
                containers:
                - name: client
                  image: busybox
                  command:
                  - sh
                  - -c
                  - for i in $(seq 1 10); do wget -qO- http://echo-svc-fallback-c/ || echo FAILED; done
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop: "{{ cloud_nodes.results | selectattr('item', 'in', ['aws', 'alibabacloud', 'tencentcloud']) | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Wait for fallback-C client jobs to complete
      command: >
        kubectl -n {{ test_ns }} get job fallback-c-client-{{ item }}
        -o jsonpath='{.status.succeeded}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: fc_job_status
      until: fc_job_status.stdout | int >= 1
      retries: 20
      delay: 10
      loop:
        - aws
        - alibabacloud
        - tencentcloud
      changed_when: false

    - name: Fetch fallback-C raw hits
      command: kubectl -n {{ test_ns }} logs job/fallback-c-client-{{ item }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: fc_raw
      loop:
        - aws
        - alibabacloud
        - tencentcloud
      changed_when: false

    - name: Show fallback-C results
      debug:
        msg:
          - "=== Fallback C: {{ item.item }} client → gcp/azure endpoint ==="
          - "{{ item.stdout_lines }}"
      loop: "{{ fc_raw.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert fallback-C reached gcp/azure from every other cloud
      vars:
        fc_clouds: "{{ item.stdout_lines | select('search', '^node=') | map('regex_replace', '^node=(\\S+).*$', '\\1') | map('extract', node_cloud) | list }}"
      assert:
        that:
          - fc_clouds | length == 10
          - (fc_clouds | unique | difference(['gcp', 'azure'])) | length == 0
        success_msg: "fallback-C: {{ item.item }} client → 10/10 {{ fc_clouds | unique | sort }}"
        fail_msg: >-
          fallback-C expected {{ item.item }} client to reach gcp/azure 10/10,
          got {{ fc_clouds | unique }} across {{ fc_clouds | length }} responses
          (empty or short means the gcp alias-IP / azure ipConfiguration datapath is broken)
      loop: "{{ fc_raw.results }}"
      loop_control:
        label: "{{ item.item }}"

    # -------------------------------------------------------
    # Step 10: 清理 fallback 测试资源
    # -------------------------------------------------------
    - name: Clean up fallback test resources
      command: >
        kubectl -n {{ test_ns }} delete deployment echo-fallback-a echo-fallback-b echo-fallback-c
        --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Clean up fallback services
      command: >
        kubectl -n {{ test_ns }} delete svc echo-svc-fallback-a echo-svc-fallback-b echo-svc-fallback-c
        --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    # -------------------------------------------------------
    # Step 11: 回归测试 — 无 trafficDistribution 的 Service 正常随机路由
    # 验证我们的改动不破坏默认行为：请求应分散到多个云，而不是只命中本地。
    # replicas 必须铺满每个节点：以前是 3 副本 + 仅 podAntiAffinity，5 个节点里
    # 随机落 3 个，每次跑命中的云都不一样，结果不可复现。
    # -------------------------------------------------------
    - name: Deploy default-routing echo server (no trafficDistribution)
      command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: echo-default
            namespace: {{ test_ns }}
          spec:
            replicas: 5
            selector:
              matchLabels:
                app: echo-default
            template:
              metadata:
                labels:
                  app: echo-default
              spec:
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app: echo-default
                      topologyKey: kubernetes.io/hostname
                containers:
                - name: echo
                  image: busybox
                  env:
                  - name: NODE_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.nodeName
                  command:
                  - sh
                  - -c
                  - mkdir -p /www && echo "node=$NODE_NAME" > /www/index.html && httpd -f -p 8080 -h /www
                  ports:
                  - containerPort: 8080
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: echo-svc-default
            namespace: {{ test_ns }}
          spec:
            selector:
              app: echo-default
            ports:
            - port: 80
              targetPort: 8080
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for default echo-server pods ready
      command: >
        kubectl -n {{ test_ns }} get deployment echo-default
        -o jsonpath='{.status.readyReplicas}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: ed_ready
      until: ed_ready.stdout | int >= 5
      retries: 30
      delay: 10
      changed_when: false

    - name: Confirm echo-svc-default has no trafficDistribution
      shell: |
        kubectl -n {{ test_ns }} get svc echo-svc-default -o json | jq -r '
          "trafficDistribution=\(.spec.trafficDistribution // "(none, default Cluster routing)")"
        '
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: default_svc_policy
      changed_when: false

    - name: Show default service policy
      debug:
        msg: "{{ default_svc_policy.stdout_lines }}"

    - name: Drop leftover default-routing client job
      command: kubectl -n {{ test_ns }} delete job default-client-aws --ignore-not-found --wait=true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    - name: Run default-routing client from AWS node (30 requests, expect spread across clouds)
      command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: default-client-aws
            namespace: {{ test_ns }}
          spec:
            ttlSecondsAfterFinished: 300
            template:
              spec:
                nodeName: {{ cloud_nodes.results | selectattr('item', 'equalto', 'aws') | map(attribute='stdout') | first }}
                restartPolicy: Never
                containers:
                - name: client
                  image: busybox
                  command:
                  - sh
                  - -c
                  - for i in $(seq 1 30); do wget -qO- http://echo-svc-default/ || echo "FAILED"; echo; done
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for default-routing client job to complete
      command: >
        kubectl -n {{ test_ns }} get job default-client-aws
        -o jsonpath='{.status.succeeded}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: ed_job_status
      until: ed_job_status.stdout | int >= 1
      retries: 20
      delay: 10
      changed_when: false

    - name: Show default-routing results (expect spread across clouds, no FAILED)
      shell: |
        echo "=== Default routing: AWS client → all clouds (expect spread, no FAILED) ==="
        kubectl -n {{ test_ns }} logs job/default-client-aws | sort | uniq -c | sort -rn
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: ed_result
      changed_when: false

    - name: Display default-routing results
      debug:
        msg: "{{ ed_result.stdout_lines }}"

    - name: Fetch default-routing raw hits
      command: kubectl -n {{ test_ns }} logs job/default-client-aws
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: ed_raw
      changed_when: false

    # This is the control group for every PreferClose case above: without
    # trafficDistribution the same client must NOT collapse onto its local
    # endpoint. If this ever asserts a single cloud, the "local hit" results
    # elsewhere prove nothing.
    - name: Assert default routing spread beyond the local cloud
      vars:
        ed_clouds: "{{ ed_raw.stdout_lines | select('search', '^node=') | map('regex_replace', '^node=(\\S+).*$', '\\1') | map('extract', node_cloud) | list }}"
      assert:
        that:
          - ed_raw.stdout_lines | select('search', 'FAILED') | list | length == 0
          - ed_clouds | length == 30
          - ed_clouds | unique | length >= 3
        success_msg: "default routing: 30 requests spread over {{ ed_clouds | unique | sort }}"
        fail_msg: >-
          default routing expected 30 responses spread over at least 3 clouds,
          got {{ ed_clouds | unique }} across {{ ed_clouds | length }} responses

    - name: Clean up default-routing test resources
      command: >
        kubectl -n {{ test_ns }} delete deployment echo-default
        svc echo-svc-default job default-client-aws
        --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    # -------------------------------------------------------
    # Step 12: 收尾 — 删掉场景 1 的工作负载
    # 以前 echo-server/echo-svc 会一直留着，下次重跑时场景 1 直接复用上一轮的 pod，
    # 部署路径根本没被重测。这里不删命名空间：topology-test-results ConfigMap 就
    # 存在里面，collect_env_info.yaml 要读它。
    # -------------------------------------------------------
    - name: Tear down the scenario-1 workload (keep ns and the results ConfigMap)
      command: >
        kubectl -n {{ test_ns }} delete deployment echo-server
        svc echo-svc
        --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Tear down leftover client jobs
      command: >
        kubectl -n {{ test_ns }} delete job
        topology-client-aws topology-client-alibabacloud topology-client-tencentcloud
        topology-client-gcp topology-client-azure
        fallback-a-client-aws fallback-b-client-aws fallback-b-client-tencentcloud
        fallback-c-client-aws fallback-c-client-alibabacloud fallback-c-client-tencentcloud
        srcip-probe
        --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
